<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capital 18 — Tu Camino Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1F33;
    --navy-2: #0F2A44;
    --paper: #F6F3EA;
    --ink: #16233A;
    --ink-soft: #4C5A70;
    --cream-soft: #A9B6C4;
    --green: #3C7A5A;
    --green-soft: #7FB89A;
    --gold: #C9A227;
    --gold-soft: #E4C765;
    --red: #A3402F;
    --line: rgba(22,35,58,0.14);
    --line-dark: rgba(239,233,218,0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --navy: #0A1F33; --paper: #F6F3EA; --ink: #16233A; }
  }
  :root[data-theme="dark"] { --navy: #0A1F33; --paper: #F6F3EA; --ink: #16233A; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--navy);
    color: var(--paper);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    padding: max(20px, env(safe-area-inset-top,0px)) 16px max(20px, env(safe-area-inset-bottom,0px));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage { width: 100%; max-width: 560px; }

  .brand { display: flex; align-items: center; gap: 9px; justify-content: center; margin-bottom: 22px; color: var(--gold-soft); }
  .brand svg { width: 22px; height: 22px; }
  .brand span { font-family: 'Libre Caslon Display', serif; font-size: 15px; letter-spacing: 0.01em; }

  .card {
    background: var(--paper);
    color: var(--ink);
    padding: clamp(26px, 6vw, 42px);
    border: 1px solid var(--line);
  }

  .round-label {
    font-family: 'Libre Caslon Display', serif;
    font-size: 12.5px;
    color: var(--green);
    margin: 0 0 14px;
  }

  .meter-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
  .meter-label { font-size: 12.5px; color: var(--ink-soft); }
  .meter-value { font-family: 'Libre Caslon Display', serif; font-size: 15px; color: var(--ink); }
  .meter-track { height: 6px; background: var(--line); width: 100%; margin-bottom: 24px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--gold); transition: width 0.5s ease; }

  .narrative {
    font-family: 'Libre Caslon Display', serif;
    font-size: clamp(18px, 2.6vw, 22px);
    line-height: 1.45;
    margin: 0 0 26px;
  }

  .delta {
    display: inline-block;
    font-size: 13px;
    padding: 2px 8px;
    margin-bottom: 18px;
    border: 1px solid var(--line);
  }
  .delta.up { color: var(--green); }
  .delta.down { color: var(--red); }

  .choices { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .choice-btn {
    background: #FBF8F1;
    color: var(--ink);
    border: none;
    padding: 16px 18px;
    text-align: left;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    cursor: pointer;
  }
  .choice-btn:hover { background: #F0E9D6; }
  .choice-btn .tag {
    display: block;
    font-size: 11.5px;
    color: var(--green);
    margin-bottom: 3px;
  }

  .ending-title { font-family: 'Libre Caslon Display', serif; font-size: clamp(22px,3.4vw,28px); margin: 0 0 12px; }
  .ending-text { font-size: 15px; line-height: 1.7; color: var(--ink-soft); margin: 0 0 24px; }

  .restart-btn {
    background: var(--navy);
    color: var(--paper);
    border: none;
    padding: 13px 20px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }
  .restart-btn:hover { background: var(--navy-2); }

  .start-btn {
    background: var(--navy);
    color: var(--paper);
    border: none;
    padding: 14px 22px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    cursor: pointer;
  }
  .start-btn:hover { background: var(--navy-2); }

  .foot-note { text-align: center; font-size: 12px; color: var(--cream-soft); margin-top: 18px; }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <svg viewBox="0 0 48 48"><path d="M24 3 L43 10 V23 C43 34 35.5 41.5 24 45 C12.5 41.5 5 34 5 23 V10 Z" fill="none" stroke="currentColor" stroke-width="2"/><text x="24" y="27" text-anchor="middle" font-family="Libre Caslon Display, serif" font-size="15" fill="currentColor">18</text><polyline points="12,34 18,29 23,32 30,24 36,27" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/></svg>
    <span>Capital 18 — Tu Camino Financiero</span>
  </div>

  <div class="card" id="card"></div>
  <div class="foot-note">MVP educativo · las decisiones y cifras son ilustrativas</div>
</div>

<script>
  const state = { patrimonio: 40, habilidades: false, round: 0 };

  const rounds = [
    {
      label: "Año 1 · Empiezas a trabajar",
      text: "Tienes 25 años. Trabajas medio tiempo y ganas un poco más del salario mínimo. Es momento de decidir qué vas a hacer con tu dinero este año.",
      choices: [
        { tag: "Ahorrar", label: "Guardar una parte cada mes, aunque sea poco.", delta: 15 },
        { tag: "Gastar", label: "Darte gusto: tu sueldo es tuyo, para eso trabajas.", delta: -10 },
        { tag: "Invertir en ti", label: "Tomar un curso corto para mejorar tus habilidades, aunque cueste ahora.", delta: -10, habilidad: true }
      ]
    },
    {
      label: "Año 3 · Una oportunidad y un riesgo",
      text: (s) => s.habilidades
        ? "El curso que tomaste te abrió una puerta: te ofrecen un mejor puesto. También un conocido te habla de una inversión que 'triplica tu dinero en un mes'."
        : "Un conocido te habla de una inversión que promete 'triplicar tu dinero en un mes'. Suena demasiado bueno.",
      choices: [
        { tag: "Todo o nada", label: "Meter tus ahorros a esa inversión 'segura'.", delta: -25 },
        { tag: "Constancia", label: "Seguir ahorrando poco a poco, sin dejarte llevar.", delta: 15 },
        { tag: "Impulso", label: "Comprar algo que siempre quisiste, sin pensarlo mucho.", delta: -5 }
      ]
    },
    {
      label: "Año 5 · Llega una crisis económica",
      text: "El país entra en una crisis económica. Los precios suben y muchas personas pierden ingresos o ven caer sus ahorros.",
      choices: [
        { tag: "Colchón", label: "Sostenerte con lo que ya habías ahorrado, sin endeudarte.", delta: 10 },
        { tag: "Deuda rápida", label: "Pedir un préstamo rápido para cubrir los gastos del mes.", delta: -15 },
        { tag: "Ansiedad", label: "Gastar en algo no esencial para sentirte mejor con todo esto.", delta: -10 }
      ]
    }
  ];

  function endingFor(score, habilidades) {
    if (score >= 70) return {
      title: "Patrimonio blindado",
      text: "Construiste el hábito antes de necesitarlo. Cuando la crisis llegó, no te tomó por sorpresa: tenías con qué sostenerte y decisiones tomadas con cabeza fría, no con miedo." + (habilidades ? " Tus habilidades también te abrieron puertas que el dinero solo no habría abierto." : "")
    };
    if (score >= 45) return {
      title: "Estable, pero vulnerable",
      text: "Vas bien, pero por poco. Algunas decisiones te ayudaron, otras te costaron. Tu patrimonio resiste hoy, aunque un tropiezo más lo habría puesto en riesgo real."
    };
    if (score >= 20) return {
      title: "Ciclo de deudas",
      text: "Cada decisión pareció razonable en su momento, pero juntas te dejaron corriendo detrás del dinero en vez de construyendo con él. Salir de ahí ahora te va a costar más tiempo del que hubiera tomado prevenirlo."
    };
    return {
      title: "Empezar de cero",
      text: "El dinero se fue más rápido de lo que llegó. No fue mala suerte: fueron decisiones, una tras otra, sin un plan detrás. La buena noticia es que esto es un juego, no tu vida — y ahí todavía puedes decidir distinto."
    };
  }

  function render() {
    const card = document.getElementById('card');

    if (state.round === -1) {
      card.innerHTML = `
        <p class="round-label">Un simulador de decisiones</p>
        <p class="narrative">Tienes 25 años, un empleo de medio tiempo y un sueldo apenas por encima del mínimo. Lo que decidas hacer con tu dinero, año tras año, va a definir tu patrimonio. ¿Listo para tomar el control?</p>
        <button class="start-btn" onclick="startGame()">Comenzar</button>
      `;
      return;
    }

    if (state.round >= rounds.length) {
      const ending = endingFor(state.patrimonio, state.habilidades);
      card.innerHTML = `
        <p class="round-label">Resultado final</p>
        <div class="meter-row"><span class="meter-label">Patrimonio</span><span class="meter-value">${state.patrimonio}</span></div>
        <div class="meter-track"><div class="meter-fill" style="width:${Math.max(0,Math.min(100,state.patrimonio))}%"></div></div>
        <h2 class="ending-title">${ending.title}</h2>
        <p class="ending-text">${ending.text}</p>
        <button class="restart-btn" onclick="startGame()">Jugar de nuevo</button>
      `;
      return;
    }

    const r = rounds[state.round];
    const text = typeof r.text === 'function' ? r.text(state) : r.text;
    card.innerHTML = `
      <p class="round-label">${r.label}</p>
      <div class="meter-row"><span class="meter-label">Patrimonio</span><span class="meter-value">${state.patrimonio}</span></div>
      <div class="meter-track"><div class="meter-fill" style="width:${Math.max(0,Math.min(100,state.patrimonio))}%"></div></div>
      <p class="narrative">${text}</p>
      <div class="choices">
        ${r.choices.map((c, i) => `
          <button class="choice-btn" onclick="choose(${i})">
            <span class="tag">${c.tag}</span>${c.label}
          </button>
        `).join('')}
      </div>
    `;
  }

  function choose(i) {
    const r = rounds[state.round];
    const c = r.choices[i];
    state.patrimonio = Math.max(0, Math.min(100, state.patrimonio + c.delta));
    if (c.habilidad) state.habilidades = true;
    state.round += 1;
    render();
  }

  function startGame() {
    state.patrimonio = 40;
    state.habilidades = false;
    state.round = 0;
    render();
  }

  state.round = -1;
  render();
</script>

</body>
</html>
